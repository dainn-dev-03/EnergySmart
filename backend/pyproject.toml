[project]
name = "energysmart-backend"
version = "0.1.0"
description = "EnergySmart - API quản lý và phân tích tiêu thụ điện năng tòa nhà"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# Vietnamese user-facing strings are intentional.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Repositories declare read-only class-level config (sort_columns), never mutated.
"app/repositories/*" = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# The local `alembic/` migrations folder must not shadow the alembic library.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
